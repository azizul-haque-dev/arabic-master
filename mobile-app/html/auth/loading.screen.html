<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Arabic Master - Loading State</title>
    <!-- Tailwind CSS CDN with plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Configuration -->
    <script data-purpose="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        };
    </script>
    <!-- Custom styles for skeleton shimmer and circular loader -->
    <style data-purpose="custom-animations">
        @keyframes pulseSoft {

            0%,
            100% {
                opacity: 0.85;
            }

            50% {
                opacity: 0.45;
            }
        }

        .skeleton-item {
            animation: pulseSoft 1.8s ease-in-out infinite;
            background-color: #e5e7eb;
        }

        @keyframes spinLoader {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-spinner {
            border: 3px solid #e5e7eb;
            border-top-color: #059669;
            border-radius: 50%;
            animation: spinLoader 0.9s linear infinite;
        }
    </style>
</head>

<body
    class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 text-slate-800 antialiased font-sans select-none">
    <!-- BEGIN: MobileDeviceFrame -->
    <div class="relative w-full max-w-[390px] h-[844px] bg-white rounded-[44px] shadow-2xl overflow-hidden border-[8px] border-slate-900 flex flex-col justify-between"
        data-purpose="mobile-viewport-container">
        <!-- BEGIN: iOSStatusBar -->
        <header class="pt-3 px-7 flex justify-between items-center z-20 shrink-0" data-purpose="ios-status-bar">
            <!-- Time Display -->
            <span class="text-[15px] font-semibold tracking-tight text-slate-900">9:41</span>
            <!-- System Icons: Signal, WiFi, Battery -->
            <div aria-label="Device Status Indicators" class="flex items-center space-x-2 text-slate-900">
                <!-- Cellular Signal -->
                <svg class="w-4 h-3 fill-current" viewbox="0 0 17 11">
                    <rect height="3" rx="0.5" width="3" x="0" y="8"></rect>
                    <rect height="5.5" rx="0.5" width="3" x="4.5" y="5.5"></rect>
                    <rect height="8" rx="0.5" width="3" x="9" y="3"></rect>
                    <rect height="10.5" rx="0.5" width="3" x="13.5" y="0.5"></rect>
                </svg>
                <!-- Wi-Fi Icon -->
                <svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
                    <path
                        d="M8 3.6c2.4 0 4.6.9 6.2 2.4l1.3-1.4C13.6 2.8 10.9 1.7 8 1.7S2.4 2.8.5 4.6l1.3 1.4C3.4 4.5 5.6 3.6 8 3.6zm0 4.2c1.3 0 2.5.5 3.4 1.3l1.3-1.4c-1.3-1.2-3-1.9-4.7-1.9s-3.4.7-4.7 1.9l1.3 1.4c.9-.8 2.1-1.3 3.4-1.3zm0 4.2c.8 0 1.5-.7 1.5-1.5S8.8 9 8 9s-1.5.7-1.5 1.5.7 1.5 1.5 1.5z">
                    </path>
                </svg>
                <!-- Battery Indicator -->
                <div class="relative flex items-center">
                    <div class="w-[22px] h-[11px] rounded-[3px] border border-current p-0.5 flex items-center">
                        <div class="w-full h-full bg-current rounded-[1.5px]"></div>
                    </div>
                    <div class="w-[1.5px] h-1 bg-current rounded-r-sm -mr-1 ml-[0.5px]"></div>
                </div>
            </div>
        </header>
        <!-- END: iOSStatusBar -->
        <!-- BEGIN: NavigationHeader -->
        <nav class="px-6 pt-3 pb-2 flex items-center relative shrink-0" data-purpose="app-navigation-bar">
            <!-- Back Arrow Button -->
            <button aria-label="Go Back"
                class="p-1 -ml-1 text-slate-400 hover:text-slate-600 focus:outline-none transition-colors"
                type="button">
                <svg class="w-6 h-6 stroke-current stroke-[2.2] fill-none" stroke-linecap="round"
                    stroke-linejoin="round" viewbox="0 0 24 24">
                    <path d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <!-- App Logo & Title (Muted State for Loading) -->
            <div class="flex items-center justify-center space-x-2 mx-auto pr-5 opacity-70">
                <!-- Logo Emblem -->
                <div aria-hidden="true"
                    class="w-7 h-7 bg-slate-300 rounded-lg flex items-center justify-center text-white">
                    <svg class="w-4 h-4 fill-white" viewbox="0 0 24 24">
                        <path
                            d="M12 4.5C7.5 4.5 3 2 3 2v14.5s4.5 2.5 9 2.5 9-2.5 9-2.5V2s-4.5 2.5-9 2.5zm0 2.2c3.4 0 6.6-1.3 7.5-1.7v10.5c-.9.4-4.1 1.7-7.5 1.7s-6.6-1.3-7.5-1.7V5c.9.4 4.1 1.7 7.5 1.7z">
                        </path>
                    </svg>
                </div>
                <span class="text-[16px] font-bold tracking-tight text-slate-400">Arabic Master</span>
            </div>
        </nav>
        <!-- END: NavigationHeader -->
        <!-- BEGIN: MainContentArea -->
        <main class="flex-1 px-6 flex flex-col justify-between pt-6 pb-6 overflow-hidden"
            data-purpose="loading-skeleton-content">
            <!-- Skeleton Form Hierarchy -->
            <div class="w-full space-y-6" data-purpose="skeleton-form-layout">
                <!-- Skeleton Header & Description Lines -->
                <div class="space-y-3">
                    <div class="h-6 w-3/5 rounded-full skeleton-item"></div>
                    <div class="h-3.5 w-4/5 rounded-full skeleton-item"></div>
                </div>
                <!-- Skeleton Input Fields Section -->
                <div class="space-y-4 pt-2">
                    <!-- Input Field 1 Skeleton -->
                    <div
                        class="w-full h-12 rounded-xl bg-slate-100/90 border border-slate-200/80 px-4 flex items-center justify-between">
                        <div class="flex items-center space-x-3 w-1/2">
                            <div class="w-4 h-4 rounded skeleton-item opacity-60"></div>
                            <div class="h-3 w-24 rounded skeleton-item opacity-60"></div>
                        </div>
                        <div class="w-4 h-4 rounded-full skeleton-item opacity-40"></div>
                    </div>
                    <!-- Input Field 2 Skeleton -->
                    <div
                        class="w-full h-12 rounded-xl bg-slate-100/90 border border-slate-200/80 px-4 flex items-center justify-between">
                        <div class="flex items-center space-x-3 w-1/2">
                            <div class="w-4 h-4 rounded skeleton-item opacity-60"></div>
                            <div class="h-3 w-20 rounded skeleton-item opacity-60"></div>
                        </div>
                        <div class="w-4 h-4 rounded-full skeleton-item opacity-40"></div>
                    </div>
                </div>
                <!-- Skeleton Action Button -->
                <div class="pt-2">
                    <div class="w-full h-12 rounded-xl skeleton-item opacity-75"></div>
                </div>
            </div>
            <!-- BEGIN: ActiveLoadingState -->
            <section aria-busy="true" aria-live="polite" class="flex flex-col items-center justify-center py-10"
                data-purpose="loading-indicator-module">
                <!-- Spinner Icon -->
                <div aria-label="Loading content" class="loading-spinner w-10 h-10 mb-4" role="status"></div>
                <!-- Feedback Labels -->
                <h2 class="text-base font-semibold text-slate-800 tracking-tight">Loading...</h2>
                <p class="text-xs text-slate-400 mt-1">Please wait a moment.</p>
            </section>
            <!-- END: ActiveLoadingState -->
            <!-- Blank Spacer to balance vertical rhythm -->
            <div class="h-4"></div>
        </main>
        <!-- END: MainContentArea -->
        <!-- BEGIN: iOSHomeIndicator -->
        <footer class="pb-2 flex justify-center items-center shrink-0" data-purpose="ios-home-indicator">
            <div class="w-36 h-1 bg-slate-900 rounded-full"></div>
        </footer>
        <!-- END: iOSHomeIndicator -->
    </div>
    <!-- END: MobileDeviceFrame -->
</body>

</html>
