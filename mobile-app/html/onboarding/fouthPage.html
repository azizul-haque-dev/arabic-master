<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>Onboarding - Daily Practice Goal</title>
    <!-- Tailwind CSS v3 with forms and container queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#F0FDF4',
                            100: '#EBF7EE',
                            500: '#22C55E',
                            600: '#16A34A',
                            700: '#15803D',
                            800: '#166534',
                            900: '#0F5132',
                            dark: '#0E5A3C',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style data-purpose="base-layout">
        body {
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            background-color: #F3F4F6;
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center p-0 sm:p-4 bg-slate-100 font-sans antialiased text-slate-900">
    <!-- BEGIN: MobileContainer -->
    <!-- iPhone Form Factor Outer Shell -->
    <div
        class="w-full max-w-[393px] h-[852px] bg-white sm:rounded-[48px] shadow-2xl relative flex flex-col justify-between overflow-hidden border-0 sm:border-[8px] sm:border-slate-800">
        <!-- BEGIN: TopBarSection -->
        <header class="w-full pt-3 px-6 shrink-0 select-none">
            <!-- iOS Status Bar -->
            <div class="flex justify-between items-center text-xs font-semibold text-slate-900 tracking-tight pt-1 pb-2"
                data-purpose="status-bar">
                <span class="text-[15px] font-semibold tracking-tight">9:41</span>
                <div class="flex items-center space-x-1.5 text-slate-900">
                    <!-- Cellular Icon -->
                    <svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
                        <path
                            d="M1 9.5a1.5 1.5 0 0 1 3 0v1a1.5 1.5 0 0 1-3 0v-1Zm4.5-3a1.5 1.5 0 0 1 3 0v4a1.5 1.5 0 0 1-3 0v-4Zm4.5-3a1.5 1.5 0 0 1 3 0v7a1.5 1.5 0 0 1-3 0v-7Zm4.5-3a1.5 1.5 0 0 1 3 0v10a1.5 1.5 0 0 1-3 0v-10Z">
                        </path>
                    </svg>
                    <!-- Wifi Icon -->
                    <svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
                        <path clip-rule="evenodd"
                            d="M8 2.5C5.07 2.5 2.45 3.73.6 5.7a.75.75 0 1 1-1.1-1.02A11.36 11.36 0 0 1 8 1c3.34 0 6.36 1.45 8.5 3.68a.75.75 0 1 1-1.1 1.02A9.87 9.87 0 0 0 8 2.5Zm0 3.5c-2.02 0-3.83.87-5.1 2.27a.75.75 0 1 1-1.1-1.02A8.34 8.34 0 0 1 8 4.5c2.3 0 4.38.93 5.9 2.45a.75.75 0 1 1-1.08 1.04A6.84 6.84 0 0 0 8 6Zm-2.5 4.5a2.5 2.5 0 1 1 5 0 2.5 2.5 0 0 1-5 0Z"
                            fill-rule="evenodd"></path>
                    </svg>
                    <!-- Battery Icon -->
                    <div class="w-6 h-3 border border-slate-900 rounded-[4px] p-0.5 flex items-center relative ml-0.5">
                        <div class="h-full w-full bg-slate-900 rounded-[2px]"></div>
                        <div class="absolute -right-1 top-0.8 w-0.5 h-1.5 bg-slate-900 rounded-r-sm"></div>
                    </div>
                </div>
            </div>
            <!-- Navigation & Step Progress Bar -->
            <div class="flex items-center justify-between mt-3 mb-1">
                <!-- Back Navigation Button -->
                <button aria-label="Go back" class="p-1.5 -ml-1 text-slate-800 hover:text-slate-600 transition-colors"
                    type="button">
                    <svg class="w-5 h-5 stroke-current stroke-2" fill="none" stroke-linecap="round"
                        stroke-linejoin="round" viewbox="0 0 24 24">
                        <path d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>
                <!-- 6-Dot Step Progress Indicator -->
                <div aria-valuemax="6" aria-valuemin="1" aria-valuenow="5" class="flex items-center space-x-2"
                    data-purpose="step-indicator" role="progressbar">
                    <!-- Step 1 -->
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-200"></div>
                    <!-- Step 2 -->
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-200"></div>
                    <!-- Step 3 -->
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-200"></div>
                    <!-- Step 4 -->
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-200"></div>
                    <!-- Step 5: Active Dot -->
                    <div class="w-2 h-2 rounded-full bg-[#15803D]"></div>
                    <!-- Step 6 -->
                    <div class="w-1.5 h-1.5 rounded-full bg-slate-200"></div>
                </div>
                <!-- Skip Action Link -->
                <button class="text-xs font-semibold text-[#15803D] hover:text-emerald-800 transition-colors py-1"
                    type="button">
                    Skip
                </button>
            </div>
        </header>
        <!-- END: TopBarSection -->
        <!-- BEGIN: MainContent -->
        <main class="flex-1 px-6 pt-6 pb-4 flex flex-col justify-start">
            <!-- Title & Headline -->
            <section class="mb-7" data-purpose="header-content">
                <h1 class="text-[25px] leading-tight font-extrabold text-slate-900 tracking-tight">
                    How much time can you practice each day?
                </h1>
                <p class="text-sm font-normal text-slate-500 mt-2">
                    Choose a goal you can comfortably maintain.
                </p>
            </section>
            <!-- Practice Duration Options List -->
            <section aria-label="Daily practice duration options" class="space-y-3" data-purpose="duration-options"
                role="radiogroup">
                <!-- Option 1: 5 minutes (Unselected) -->
                <label
                    class="flex items-center justify-between p-4 rounded-xl border border-slate-200 bg-white shadow-sm cursor-pointer hover:border-slate-300 transition-all select-none">
                    <div class="flex items-center space-x-3.5">
                        <!-- Clock Icon -->
                        <div class="text-slate-800">
                            <svg class="w-6 h-6 stroke-[1.8] stroke-current fill-none" stroke-linecap="round"
                                stroke-linejoin="round" viewbox="0 0 24 24">
                                <circle cx="12" cy="12" r="9"></circle>
                                <polyline points="12 7 12 12 15 15"></polyline>
                            </svg>
                        </div>
                        <span class="text-[15px] font-semibold text-slate-900 tracking-tight">5 minutes</span>
                    </div>
                    <!-- Unchecked Radio Indicator -->
                    <div class="w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center"></div>
                </label>
                <!-- Option 2: 10 minutes (Selected State) -->
                <label
                    class="flex items-center justify-between p-4 rounded-xl border-2 border-[#15803D] bg-[#EBF7EE] shadow-sm cursor-pointer select-none">
                    <div class="flex items-center space-x-3.5">
                        <!-- Clock Icon -->
                        <div class="text-[#0E5A3C]">
                            <svg class="w-6 h-6 stroke-[1.8] stroke-current fill-none" stroke-linecap="round"
                                stroke-linejoin="round" viewbox="0 0 24 24">
                                <circle cx="12" cy="12" r="9"></circle>
                                <polyline points="12 7 12 12 15 15"></polyline>
                            </svg>
                        </div>
                        <span class="text-[15px] font-bold text-slate-900 tracking-tight">10 minutes</span>
                    </div>
                    <!-- Checked Indicator Circle -->
                    <div class="w-5 h-5 rounded-full bg-[#15803D] flex items-center justify-center text-white">
                        <svg class="w-3.5 h-3.5 stroke-current stroke-[2.8] fill-none" stroke-linecap="round"
                            stroke-linejoin="round" viewbox="0 0 24 24">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                </label>
                <!-- Option 3: 15 minutes (Unselected) -->
                <label
                    class="flex items-center justify-between p-4 rounded-xl border border-slate-200 bg-white shadow-sm cursor-pointer hover:border-slate-300 transition-all select-none">
                    <div class="flex items-center space-x-3.5">
                        <!-- Clock Icon -->
                        <div class="text-slate-800">
                            <svg class="w-6 h-6 stroke-[1.8] stroke-current fill-none" stroke-linecap="round"
                                stroke-linejoin="round" viewbox="0 0 24 24">
                                <circle cx="12" cy="12" r="9"></circle>
                                <polyline points="12 7 12 12 15 15"></polyline>
                            </svg>
                        </div>
                        <span class="text-[15px] font-semibold text-slate-900 tracking-tight">15 minutes</span>
                    </div>
                    <!-- Unchecked Radio Indicator -->
                    <div class="w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center"></div>
                </label>
                <!-- Option 4: 20+ minutes (Unselected) -->
                <label
                    class="flex items-center justify-between p-4 rounded-xl border border-slate-200 bg-white shadow-sm cursor-pointer hover:border-slate-300 transition-all select-none">
                    <div class="flex items-center space-x-3.5">
                        <!-- Clock Icon -->
                        <div class="text-slate-800">
                            <svg class="w-6 h-6 stroke-[1.8] stroke-current fill-none" stroke-linecap="round"
                                stroke-linejoin="round" viewbox="0 0 24 24">
                                <circle cx="12" cy="12" r="9"></circle>
                                <polyline points="12 7 12 12 15 15"></polyline>
                            </svg>
                        </div>
                        <span class="text-[15px] font-semibold text-slate-900 tracking-tight">20+ minutes</span>
                    </div>
                    <!-- Unchecked Radio Indicator -->
                    <div class="w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center"></div>
                </label>
            </section>
            <!-- Footnote Microcopy -->
            <aside class="flex items-center space-x-2 mt-5 text-slate-500 text-[13px]" data-purpose="footnote-hint">
                <svg class="w-4 h-4 text-slate-400 fill-none stroke-current stroke-2 shrink-0" stroke-linecap="round"
                    stroke-linejoin="round" viewbox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" x2="12" y1="16" y2="12"></line>
                    <line x1="12" x2="12.01" y1="8" y2="8"></line>
                </svg>
                <span>You can change this later.</span>
            </aside>
        </main>
        <!-- END: MainContent -->
        <!-- BEGIN: FooterCTA -->
        <footer class="p-6 pt-2 pb-8 flex flex-col items-center shrink-0">
            <!-- Primary Action CTA Button -->
            <button
                class="w-full py-4 bg-[#0F5132] hover:bg-[#0c4128] active:bg-[#093520] text-white text-[16px] font-bold rounded-xl transition duration-150 shadow-md shadow-emerald-950/10"
                type="button">
                Start Learning
            </button>
            <!-- iOS Home Indicator bar -->
            <div class="w-36 h-1 bg-slate-900 rounded-full mt-6 opacity-90" data-purpose="home-indicator"></div>
        </footer>
        <!-- END: FooterCTA -->
    </div>
    <!-- END: MobileContainer -->
</body>

</html>
