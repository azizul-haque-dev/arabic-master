<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#006d37",
              "outline-variant": "#bccabc",
              "surface-bright": "#f8f9fa",
              "on-primary-fixed": "#00210c",
              "on-tertiary-container": "#00392c",
              "on-surface": "#191c1d",
              "on-secondary": "#ffffff",
              error: "#ba1a1a",
              "on-secondary-fixed": "#161d1f",
              "on-primary-container": "#00391a",
              "surface-container-highest": "#e1e3e4",
              "error-container": "#ffdad6",
              surface: "#f8f9fa",
              "on-error-container": "#93000a",
              "surface-variant": "#e1e3e4",
              "on-tertiary-fixed-variant": "#005140",
              "surface-dim": "#d9dadb",
              "on-surface-variant": "#3d4a3f",
              background: "#f8f9fa",
              "on-primary-fixed-variant": "#005228",
              "inverse-primary": "#61de8a",
              "surface-container-high": "#e7e8e9",
              "on-secondary-fixed-variant": "#41484a",
              "primary-fixed": "#7efba4",
              tertiary: "#006b55",
              "on-tertiary": "#ffffff",
              "secondary-fixed-dim": "#c1c8ca",
              "surface-container": "#edeeef",
              "inverse-surface": "#2e3132",
              outline: "#6d7a6e",
              "tertiary-fixed-dim": "#4bddb7",
              "tertiary-container": "#00ad8b",
              "primary-container": "#27ae60",
              secondary: "#586062",
              "tertiary-fixed": "#6dfad2",
              "on-background": "#191c1d",
              "primary-fixed-dim": "#61de8a",
              "on-tertiary-fixed": "#002018",
              "surface-container-low": "#f3f4f5",
              "inverse-on-surface": "#f0f1f2",
              "surface-tint": "#006d37",
              "on-error": "#ffffff",
              "surface-container-lowest": "#ffffff",
              "secondary-container": "#dae1e3",
              "on-primary": "#ffffff",
              "secondary-fixed": "#dde4e6",
              "on-secondary-container": "#5d6466",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              gutter: "20px",
              xl: "64px",
              md: "24px",
              sm: "16px",
              "container-max": "1200px",
              lg: "40px",
              xs: "8px",
              base: "4px",
            },
            fontFamily: {
              "headline-md": ["Plus Jakarta Sans"],
              "display-lg": ["Plus Jakarta Sans"],
              "arabic-display": ["Inter"],
              "headline-lg": ["Plus Jakarta Sans"],
              "body-md": ["Inter"],
              "label-md": ["Inter"],
              "body-lg": ["Inter"],
              "headline-lg-mobile": ["Plus Jakarta Sans"],
            },
            fontSize: {
              "headline-md": [
                "24px",
                { lineHeight: "32px", fontWeight: "600" },
              ],
              "display-lg": [
                "48px",
                {
                  lineHeight: "56px",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "arabic-display": [
                "40px",
                { lineHeight: "60px", fontWeight: "500" },
              ],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              "label-md": ["14px", { lineHeight: "20px", fontWeight: "600" }],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
              "headline-lg-mobile": [
                "28px",
                { lineHeight: "36px", fontWeight: "700" },
              ],
            },
          },
        },
      };
    </script>
    <style>
      @layer base {
        body {
          overscroll-behavior: none;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"
  >
    <header class="w-full pt-safe bg-surface">
      <div class="px-gutter pt-8 pb-4 flex flex-col gap-6">
        <div class="flex justify-center items-center h-12 w-full">
          <img
            alt="Arabic Master logo"
            class="h-10 w-auto"
            src="https://lh3.googleusercontent.com/aida/AEtjO1XEk2QNOzM4amzU6ghTV7ytz0TiiP3583fs8q5wgFZOUG-IayZ-MKdvsX-Bh_3EKaZm3b5BArtz3GmC3MlBgKIl6non2rQkis4t8mouR3MEXItk5j5PmDxn2kpMQD7QZzORaO0UKUwOyAw2c_bjwiXvGPCGHM4826gylchv4QBDqSxuar1sWgpwWuooQgeit78D1liy5yfkeh63fdkJwYfXsSyy7XvR46Xufa-Mr0IVnD_E0ihKqEqLXGw"
          />
        </div>
        <div
          class="w-full h-2 bg-surface-container rounded-full overflow-hidden"
        >
          <div
            class="h-full bg-primary-container rounded-full transition-all duration-500"
            style="width: 25%"
          ></div>
        </div>
      </div>
    </header>
    <main class="flex-1 flex flex-col w-full">
      <div
        class="flex flex-col w-full h-full min-h-[884px] bg-surface relative pb-safe"
      >
        <!-- Progress Header -->
        <div class="flex flex-col w-full px-4 pt-6 gap-2">
          <div
            class="flex justify-between items-center text-label-md text-on-surface-variant"
          >
            <span>Step 1 of 4</span>
            <span class="font-bold text-primary">25%</span>
          </div>
          <div
            class="w-full h-2 bg-surface-container rounded-full overflow-hidden"
          >
            <div
              class="h-full bg-primary-container rounded-full transition-all duration-500 ease-out"
              style="width: 25%"
            ></div>
          </div>
        </div>
        <!-- Main Content -->
        <div class="flex-1 flex flex-col px-4 pt-10 pb-24 gap-8">
          <!-- Icon & Header -->
          <div class="flex flex-col items-center text-center gap-4">
            <div
              class="w-20 h-20 rounded-2xl bg-primary-container/10 text-primary-container flex items-center justify-center shadow-sm relative overflow-hidden"
            >
              <!-- Abstract decorative shapes inside icon -->
              <div
                class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-primary-fixed to-transparent"
              ></div>
              <span
                class="font-arabic-display text-4xl"
                style="font-feature-settings: &quot;cv11&quot;"
                >ع</span
              >
            </div>
            <div class="flex flex-col gap-2">
              <h1 class="font-headline-lg-mobile text-on-surface">
                Choose your language
              </h1>
              <p
                class="font-body-md text-on-surface-variant max-w-[280px] mx-auto leading-relaxed"
              >
                We'll use this language to guide you while you learn Arabic.
              </p>
            </div>
          </div>
          <!-- Language Options -->
          <div class="flex flex-col gap-4 mt-2">
            <!-- Option 1: Bangla (Selected) -->
            <label
              class="group relative flex items-start gap-4 p-5 rounded-2xl bg-surface-container-lowest shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] cursor-pointer transition-all duration-200 hover:shadow-[0_8px_30px_-4px_rgba(0,0,0,0.08)] ring-2 ring-primary-container isolate"
            >
              <!-- Subtle background tint for selected state -->
              <div
                class="absolute inset-0 bg-primary-container/5 rounded-2xl -z-10"
              ></div>
              <div class="flex-shrink-0 mt-1">
                <span class="text-3xl filter drop-shadow-sm">🇧🇩</span>
              </div>
              <div class="flex-1 flex flex-col">
                <span class="font-headline-md text-on-surface text-xl"
                  >বাংলা</span
                >
                <span class="font-body-md text-on-surface-variant text-sm mt-1"
                  >Learn Arabic with Bangla explanations</span
                >
              </div>
              <div
                class="flex-shrink-0 flex items-center justify-center w-6 h-6 rounded-full bg-primary-container mt-2"
              >
                <span
                  class="material-symbols-outlined text-on-primary text-[16px]"
                  style="font-variation-settings: &quot;FILL&quot; 1"
                  >check</span
                >
              </div>
              <input
                checked=""
                class="sr-only"
                name="language"
                type="radio"
                value="bn"
              />
            </label>
            <!-- Option 2: English (Unselected) -->
            <label
              class="group relative flex items-start gap-4 p-5 rounded-2xl bg-surface-container-lowest shadow-sm cursor-pointer transition-all duration-200 hover:shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)] ring-1 ring-outline-variant hover:ring-primary-container/30"
            >
              <div
                class="flex-shrink-0 mt-1 opacity-90 group-hover:opacity-100 transition-opacity"
              >
                <span class="text-3xl filter drop-shadow-sm">🇬🇧</span>
              </div>
              <div class="flex-1 flex flex-col">
                <span class="font-headline-md text-on-surface text-xl"
                  >English</span
                >
                <span class="font-body-md text-on-surface-variant text-sm mt-1"
                  >Learn Arabic with English explanations</span
                >
              </div>
              <div
                class="flex-shrink-0 flex items-center justify-center w-6 h-6 rounded-full ring-2 ring-inset ring-outline-variant mt-2 group-hover:ring-primary-container/50 transition-colors"
              ></div>
              <input class="sr-only" name="language" type="radio" value="en" />
            </label>
          </div>
        </div>
        <!-- Bottom Action -->
        <div
          class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-surface via-surface to-transparent pb-safe-offset-4"
        >
          <button
            class="w-full h-14 rounded-xl bg-primary-container text-on-primary font-label-md text-lg flex items-center justify-center gap-2 shadow-[0_8px_20px_-6px_rgba(39,174,96,0.4)] active:scale-[0.98] transition-all"
          >
            Continue
            <span
              class="material-symbols-outlined text-xl transition-transform group-hover:translate-x-1"
              >arrow_forward</span
            >
          </button>
        </div>
      </div>
      <script>
        // Simple interactive toggle for demo purposes
        document.addEventListener("DOMContentLoaded", () => {
          const labels = document.querySelectorAll("label");

          labels.forEach((label) => {
            label.addEventListener("click", (e) => {
              // Reset all
              labels.forEach((l) => {
                l.classList.remove(
                  "ring-2",
                  "ring-primary-container",
                  "shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)]",
                );
                l.classList.add("ring-1", "ring-outline-variant", "shadow-sm");

                const bgTint = l.querySelector(".absolute.inset-0");
                if (bgTint) bgTint.remove();

                const iconContainer = l.querySelector(".w-6.h-6");
                iconContainer.className =
                  "flex-shrink-0 flex items-center justify-center w-6 h-6 rounded-full ring-2 ring-inset ring-outline-variant mt-2 group-hover:ring-primary-container/50 transition-colors";
                iconContainer.innerHTML = "";
              });

              // Set active
              label.classList.remove(
                "ring-1",
                "ring-outline-variant",
                "shadow-sm",
              );
              label.classList.add(
                "ring-2",
                "ring-primary-container",
                "shadow-[0_4px_20px_-4px_rgba(0,0,0,0.05)]",
                "isolate",
              );

              // Add bg tint
              label.insertAdjacentHTML(
                "afterbegin",
                '<div class="absolute inset-0 bg-primary-container/5 rounded-2xl -z-10"></div>',
              );

              // Update icon
              const iconContainer = label.querySelector(".w-6.h-6");
              iconContainer.className =
                "flex-shrink-0 flex items-center justify-center w-6 h-6 rounded-full bg-primary-container mt-2";
              iconContainer.innerHTML =
                '<span class="material-symbols-outlined text-on-primary text-[16px]" style="font-variation-settings: \'FILL\' 1;">check</span>';
            });
          });
        });
      </script>
    </main>
  </body>
</html>
