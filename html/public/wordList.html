<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Kalam - Learn Words</title>
    <link rel="stylesheet" href="../assets/app.css" />
    <script defer src="../assets/app.js"></script>
  </head>
  <body
    class="bg-gray-100 font-sans antialiased text-gray-900 selection:bg-primary-light flex justify-center items-center min-h-screen sm:py-8"
  >
    <div
      class="w-full max-w-[428px] h-[100dvh] sm:h-[900px] bg-background relative sm:rounded-[3rem] sm:border-[10px] sm:border-gray-900 shadow-2xl overflow-hidden flex flex-col"
    >
      <header
        class="absolute top-0 left-0 right-0 h-14 glass-nav z-50 flex items-center px-2"
      >
        <button
          class="w-12 h-12 flex items-center justify-center rounded-full text-gray-700 hover:bg-gray-100/50 active:scale-95 transition-all"
          aria-label="Go back"
        >
          <svg
            class="w-[22px] h-[22px]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>

        <div class="flex-1 text-center pr-12">
          <h1 class="font-bold text-[17px] text-gray-900 tracking-tight">
            Vocabulary
          </h1>
        </div>
      </header>

      <main
        class="flex-1 overflow-y-auto no-scrollbar pt-[72px] pb-[100px] px-5"
      >
        <div class="mb-5">
          <h2 class="text-[22px] font-extrabold text-gray-900 leading-tight">
            Master Core Words
          </h2>
          <p class="text-[14px] text-gray-500 font-medium mt-1">
            Tap a category to start learning.
          </p>
        </div>

        <div class="flex flex-col gap-4">
          <div
            class="bg-white rounded-[1.5rem] border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.02)] overflow-hidden"
          >
            <button
              class="accordion-trigger w-full p-4 flex items-center gap-4 text-left active:bg-gray-50 transition-colors is-open"
              aria-expanded="true"
              aria-controls="content-1"
            >
              <div
                class="w-12 h-12 shrink-0 rounded-2xl bg-pink-50 flex items-center justify-center text-xl"
              >
                ❓
              </div>
              <div class="flex-1 py-1">
                <h3 class="font-bold text-[15px] text-gray-900 leading-tight">
                  WH Questions
                </h3>
                <p
                  class="text-[13px] text-gray-400 font-medium mt-0.5 font-bangla-text"
                >
                  প্রশ্নবোধক শব্দ
                </p>
              </div>
              <div class="flex items-center gap-3">
                <span
                  class="text-[12px] font-bold text-primary bg-primary-light px-2 py-1 rounded-md"
                  >2/4</span
                >
                <svg
                  class="chevron w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.5"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </div>
            </button>

            <div id="content-1" class="accordion-content is-open">
              <div class="px-4 pb-4">
                <div class="w-full h-[1px] bg-gray-100 mb-2"></div>
                <ul class="flex flex-col gap-2">
                  <li
                    class="flex items-center justify-between p-3 rounded-xl hover:bg-gray-50 transition-colors"
                  >
                    <div class="flex flex-col">
                      <span class="font-bold text-[15px] text-gray-900"
                        >Who</span
                      >
                      <span class="font-bangla-text text-[13px] text-gray-500"
                        >কে (Ke)</span
                      >
                    </div>
                    <div class="flex items-center gap-4">
                      <span
                        class="font-arabic-text text-xl font-bold text-primary"
                        dir="rtl"
                        >مَن</span
                      >
                      <button
                        class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center active:scale-95 active:bg-primary active:text-white transition-all"
                        aria-label="Play pronunciation"
                      >
                        <svg
                          class="w-4 h-4 ml-0.5"
                          fill="currentColor"
                          viewBox="0 0 24 24"
                        >
                          <path d="M8 5v14l11-7z" />
                        </svg>
                      </button>
                    </div>
                  </li>
                  <li
                    class="flex items-center justify-between p-3 rounded-xl hover:bg-gray-50 transition-colors"
                  >
                    <div class="flex flex-col">
                      <span class="font-bold text-[15px] text-gray-900"
                        >What</span
                      >
                      <span class="font-bangla-text text-[13px] text-gray-500"
                        >কী (Ki)</span
                      >
                    </div>
                    <div class="flex items-center gap-4">
                      <span
                        class="font-arabic-text text-xl font-bold text-primary"
                        dir="rtl"
                        >مَاذَا</span
                      >
                      <button
                        class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center active:scale-95 active:bg-primary active:text-white transition-all"
                        aria-label="Play pronunciation"
                      >
                        <svg
                          class="w-4 h-4 ml-0.5"
                          fill="currentColor"
                          viewBox="0 0 24 24"
                        >
                          <path d="M8 5v14l11-7z" />
                        </svg>
                      </button>
                    </div>
                  </li>
                  <li
                    class="flex items-center justify-between p-3 rounded-xl hover:bg-gray-50 transition-colors"
                  >
                    <div class="flex flex-col">
                      <span class="font-bold text-[15px] text-gray-900"
                        >How</span
                      >
                      <span class="font-bangla-text text-[13px] text-gray-500"
                        >কীভাবে (Kibhabe)</span
                      >
                    </div>
                    <div class="flex items-center gap-4">
                      <span
                        class="font-arabic-text text-xl font-bold text-gray-800"
                        dir="rtl"
                        >كَيْفَ</span
                      >
                      <button
                        class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center active:scale-95 active:bg-primary active:text-white transition-all"
                        aria-label="Play pronunciation"
                      >
                        <svg
                          class="w-4 h-4 ml-0.5"
                          fill="currentColor"
                          viewBox="0 0 24 24"
                        >
                          <path d="M8 5v14l11-7z" />
                        </svg>
                      </button>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </div>

          <div
            class="bg-white rounded-[1.5rem] border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.02)] overflow-hidden"
          >
            <button
              class="accordion-trigger w-full p-4 flex items-center gap-4 text-left active:bg-gray-50 transition-colors"
              aria-expanded="false"
              aria-controls="content-2"
            >
              <div
                class="w-12 h-12 shrink-0 rounded-2xl bg-green-50 flex items-center justify-center text-xl"
              >
                📍
              </div>
              <div class="flex-1 py-1">
                <h3 class="font-bold text-[15px] text-gray-900 leading-tight">
                  Prepositions
                </h3>
                <p
                  class="text-[13px] text-gray-400 font-medium mt-0.5 font-bangla-text"
                >
                  অবসথানসূচক অব্যয়
                </p>
              </div>
              <div class="flex items-center gap-3">
                <div
                  class="w-7 h-7 rounded-full bg-green-100 text-green-500 flex items-center justify-center"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3"
                      d="M5 13l4 4L19 7"
                    />
                  </svg>
                </div>
                <svg
                  class="chevron w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.5"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </div>
            </button>
            <div id="content-2" class="accordion-content">
              <div class="px-4 pb-4">
                <div class="w-full h-[1px] bg-gray-100 mb-2"></div>
                <ul class="flex flex-col gap-2">
                  <li
                    class="flex items-center justify-between p-3 rounded-xl hover:bg-gray-50 transition-colors"
                  >
                    <div class="flex flex-col">
                      <span class="font-bold text-[15px] text-gray-900"
                        >In / Inside</span
                      >
                      <span class="font-bangla-text text-[13px] text-gray-500"
                        >ভিতরে</span
                      >
                    </div>
                    <div class="flex items-center gap-4">
                      <span
                        class="font-arabic-text text-xl font-bold text-gray-800"
                        dir="rtl"
                        >فِي</span
                      >
                      <button
                        class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center active:scale-95 active:bg-primary active:text-white transition-all"
                      >
                        <svg
                          class="w-4 h-4 ml-0.5"
                          fill="currentColor"
                          viewBox="0 0 24 24"
                        >
                          <path d="M8 5v14l11-7z" />
                        </svg>
                      </button>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </div>

          <div
            class="bg-white rounded-[1.5rem] border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.02)] overflow-hidden"
          >
            <button
              class="accordion-trigger w-full p-4 flex items-center gap-4 text-left active:bg-gray-50 transition-colors"
              aria-expanded="false"
              aria-controls="content-3"
            >
              <div
                class="w-12 h-12 shrink-0 rounded-2xl bg-orange-50 flex items-center justify-center text-xl"
              >
                ⏳
              </div>
              <div class="flex-1 py-1">
                <h3 class="font-bold text-[15px] text-gray-900 leading-tight">
                  Time & Frequency
                </h3>
                <p
                  class="text-[13px] text-gray-400 font-medium mt-0.5 font-bangla-text"
                >
                  সময় এবং ফ্রিকোয়েন্সি
                </p>
              </div>
              <div class="flex items-center gap-3">
                <span
                  class="text-[12px] font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-md"
                  >0/8</span
                >
                <svg
                  class="chevron w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.5"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </div>
            </button>
            <div id="content-3" class="accordion-content">
              <div class="px-4 pb-4">
                <div class="w-full h-[1px] bg-gray-100 mb-2"></div>
                <div class="p-4 text-center text-sm text-gray-500 font-medium">
                  Content loads here...
                </div>
              </div>
            </div>
          </div>

          <div
            class="bg-white rounded-[1.5rem] border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.02)] overflow-hidden"
          >
            <button
              class="accordion-trigger w-full p-4 flex items-center gap-4 text-left active:bg-gray-50 transition-colors"
              aria-expanded="false"
              aria-controls="content-4"
            >
              <div
                class="w-12 h-12 shrink-0 rounded-2xl bg-purple-50 flex items-center justify-center text-xl"
              >
                s🔀
              </div>
              <div class="flex-1 py-1">
                <h3 class="font-bold text-[15px] text-gray-900 leading-tight">
                  Conditions & Options
                </h3>
                <p
                  class="text-[13px] text-gray-400 font-medium mt-0.5 font-bangla-text"
                >
                  শর্ত এবং বিকল্প
                </p>
              </div>
              <div class="flex items-center gap-3">
                <span
                  class="text-[12px] font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-md"
                  >0/6</span
                >
                <svg
                  class="chevron w-5 h-5 text-gray-400"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.5"
                    d="M19 9l-7 7-7-7"
                  />
                </svg>
              </div>
            </button>
            <div id="content-4" class="accordion-content">
              <div class="px-4 pb-4">
                <div class="w-full h-[1px] bg-gray-100 mb-2"></div>
                <div class="p-4 text-center text-sm text-gray-500 font-medium">
                  Content loads here...
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <nav
        class="absolute bottom-0 left-0 right-0 h-[84px] glass-nav-bottom z-50 flex items-center justify-around px-2 pb-5 pt-3"
      >
        <button
          class="flex flex-col items-center gap-1.5 w-16 text-gray-400 hover:text-gray-600 active:scale-95 transition-all"
        >
          <svg
            class="w-[26px] h-[26px]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            />
          </svg>
          <span class="text-[11px] font-semibold">Home</span>
        </button>

        <button
          class="flex flex-col items-center gap-1.5 w-16 text-primary active:scale-95 transition-transform"
        >
          <svg
            class="w-[26px] h-[26px]"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path d="M4.5 3.75a3 3 0 00-3 3v.75h21v-.75a3 3 0 00-3-3h-15z" />
            <path
              fill-rule="evenodd"
              d="M22.5 9.75h-21v7.5a3 3 0 003 3h15a3 3 0 003-3v-7.5zm-18 3.75a.75.75 0 01.75-.75h6a.75.75 0 010 1.5h-6a.75.75 0 01-.75-.75zm.75 2.25a.75.75 0 000 1.5h3a.75.75 0 000-1.5h-3z"
              clip-rule="evenodd"
            />
          </svg>
          <span class="text-[11px] font-bold">Lessons</span>
        </button>

        <button
          class="flex flex-col items-center gap-1.5 w-16 text-gray-400 hover:text-gray-600 active:scale-95 transition-all"
        >
          <svg
            class="w-[26px] h-[26px]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.2"
              d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"
            />
          </svg>
          <span class="text-[11px] font-semibold">Rank</span>
        </button>

        <button
          class="flex flex-col items-center gap-1.5 w-16 text-gray-400 hover:text-gray-600 active:scale-95 transition-all"
        >
          <svg
            class="w-[26px] h-[26px]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
          <span class="text-[11px] font-semibold">Profile</span>
        </button>
      </nav>
    </div>
  </body>
</html>
