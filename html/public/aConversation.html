<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Kalam - Conversation Situations</title>

    <!-- Premium Fonts -->

    <!-- Tailwind CSS v3 -->
    <link rel="stylesheet" href="../assets/app.css" />
    <script defer src="../assets/app.js"></script>
  </head>
  <body
    class="bg-gray-100 font-sans antialiased text-gray-900 selection:bg-primary-light flex justify-center items-center min-h-screen sm:py-8"
  >
    <!-- Mobile Device Simulator Container -->
    <div
      class="w-full max-w-[428px] h-[100dvh] sm:h-[900px] bg-background relative sm:rounded-[3rem] sm:border-[10px] sm:border-gray-900 shadow-2xl overflow-hidden flex flex-col"
    >
      <!-- Sticky Top Bar (56px) -->
      <header
        class="absolute top-0 left-0 right-0 h-14 glass-nav z-50 flex items-center px-2"
      >
        <!-- Very Left: Back Button (44x44 min touch target) -->
        <button
          class="w-12 h-12 flex items-center justify-center rounded-full text-gray-700 hover:bg-gray-100/50 active:scale-95 transition-all"
          aria-label="Go back to Categories"
        >
          <svg
            class="w-[22px] h-[22px]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>

        <!-- Center: Conversation Title -->
        <div class="flex-1 text-center pr-12">
          <h1 class="font-bold text-[16px] text-gray-900 tracking-tight">
            At the Restaurant
          </h1>
        </div>
      </header>

      <!-- Main Scrollable Content -->
      <main
        class="flex-1 overflow-y-auto no-scrollbar pt-[72px] pb-[100px] px-5"
      >
        <!-- Module Context & Progress Header -->
        <div class="mb-6 flex flex-col items-center text-center mt-2">
          <div
            class="w-16 h-16 bg-gradient-to-br from-pink-100 to-purple-100 rounded-[1.25rem] flex items-center justify-center text-3xl mb-4 shadow-sm border border-white"
          >
            🍽️
          </div>
          <h2 class="text-[20px] font-extrabold text-gray-900 leading-tight">
            Master Restaurant<br />Conversations
          </h2>

          <!-- Progress Indicator -->
          <div class="w-full mt-5">
            <div class="flex justify-between items-end mb-1.5 px-1">
              <span class="text-[13px] font-bold text-gray-700"
                >Situations</span
              >
              <span class="text-[12px] font-bold text-primary"
                >1 of 4 Completed</span
              >
            </div>
            <div
              class="w-full h-2.5 bg-gray-200/80 rounded-full overflow-hidden"
            >
              <div
                class="h-full bg-primary rounded-full transition-all duration-1000 ease-out w-[25%]"
              ></div>
            </div>
          </div>
        </div>

        <!-- Situations List -->
        <div class="flex flex-col gap-3.5">
          <!-- Situation 1: Completed State -->
          <button
            class="w-full bg-white p-4 rounded-[1.5rem] border border-gray-100 shadow-[0_2px_10px_rgba(0,0,0,0.02)] flex items-center gap-4 text-left active:scale-[0.98] transition-transform opacity-90 group"
            aria-label="Completed: Greeting & Table Request"
          >
            <div
              class="w-[52px] h-[52px] shrink-0 rounded-2xl bg-gray-50 flex items-center justify-center text-2xl grayscale group-hover:grayscale-0 transition-all"
            >
              👋
            </div>
            <div class="flex-1 py-1">
              <h3
                class="font-bold text-[15px] text-gray-900 leading-tight mb-1"
              >
                Greeting & Table Request
              </h3>
              <p class="text-[13px] text-gray-500 font-medium font-bangla-text">
                শুভেচ্ছা এবং টেবিলের অনুরোধ
              </p>
            </div>
            <!-- Right Icon: Completed -->
            <div
              class="w-8 h-8 shrink-0 rounded-full bg-green-100 text-green-500 flex items-center justify-center"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="3"
                  d="M5 13l4 4L19 7"
                />
              </svg>
            </div>
          </button>

          <!-- Situation 2: Active / Next Up State -->
          <button
            class="w-full bg-white p-4 rounded-[1.5rem] border-2 border-primary shadow-[0_4px_16px_rgba(236,72,153,0.08)] flex items-center gap-4 text-left active:scale-[0.98] transition-transform relative overflow-hidden"
            aria-label="Current: Ordering Food & Drinks"
          >
            <!-- Subtle gradient glow behind the active card -->
            <div
              class="absolute right-0 top-0 w-24 h-full bg-gradient-to-l from-primary-light/40 to-transparent"
            ></div>

            <div
              class="w-[52px] h-[52px] shrink-0 rounded-2xl bg-pink-50 flex items-center justify-center text-2xl relative z-10"
            >
              🥘
            </div>
            <div class="flex-1 py-1 relative z-10">
              <h3
                class="font-bold text-[15px] text-gray-900 leading-tight mb-1"
              >
                Ordering Food & Drinks
              </h3>
              <p class="text-[13px] text-primary font-medium font-bangla-text">
                খাবার এবং পানীয় অর্ডার করা
              </p>
            </div>
            <!-- Right Icon: Play / Active -->
            <div
              class="w-10 h-10 shrink-0 rounded-full bg-primary text-white flex items-center justify-center shadow-md relative z-10"
            >
              <svg
                class="w-5 h-5 ml-0.5"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
            </div>
          </button>

          <!-- Situation 3: Locked State -->
          <button
            class="w-full bg-gray-50 p-4 rounded-[1.5rem] border border-gray-100 flex items-center gap-4 text-left opacity-70 transition-transform active:translate-x-1"
            aria-label="Locked: Making a Complaint"
          >
            <div
              class="w-[52px] h-[52px] shrink-0 rounded-2xl bg-gray-200/50 flex items-center justify-center text-2xl grayscale opacity-50"
            >
              🤔
            </div>
            <div class="flex-1 py-1">
              <h3
                class="font-bold text-[15px] text-gray-500 leading-tight mb-1"
              >
                Making a Complaint
              </h3>
              <p class="text-[13px] text-gray-400 font-medium font-bangla-text">
                অভিযোগ করা
              </p>
            </div>
            <!-- Right Icon: Locked -->
            <div
              class="w-8 h-8 shrink-0 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center"
            >
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path
                  fill-rule="evenodd"
                  d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                  clip-rule="evenodd"
                />
              </svg>
            </div>
          </button>

          <!-- Situation 4: Locked State -->
          <button
            class="w-full bg-gray-50 p-4 rounded-[1.5rem] border border-gray-100 flex items-center gap-4 text-left opacity-70 transition-transform active:translate-x-1"
            aria-label="Locked: Paying the Bill"
          >
            <div
              class="w-[52px] h-[52px] shrink-0 rounded-2xl bg-gray-200/50 flex items-center justify-center text-2xl grayscale opacity-50"
            >
              💳
            </div>
            <div class="flex-1 py-1">
              <h3
                class="font-bold text-[15px] text-gray-500 leading-tight mb-1"
              >
                Paying the Bill
              </h3>
              <p class="text-[13px] text-gray-400 font-medium font-bangla-text">
                বিল পরিশোধ করা
              </p>
            </div>
            <!-- Right Icon: Locked -->
            <div
              class="w-8 h-8 shrink-0 rounded-full bg-gray-200 text-gray-400 flex items-center justify-center"
            >
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path
                  fill-rule="evenodd"
                  d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                  clip-rule="evenodd"
                />
              </svg>
            </div>
          </button>
        </div>
      </main>

      <!-- Fixed Bottom Nav (84px) -->
      <nav
        class="absolute bottom-0 left-0 right-0 h-[84px] glass-nav-bottom z-50 flex items-center justify-around px-2 pb-5 pt-3"
      >
        <!-- Home -->
        <button
          class="flex flex-col items-center gap-1.5 w-16 text-gray-400 hover:text-gray-600 active:scale-95 transition-all"
        >
          <svg
            class="w-[26px] h-[26px]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            />
          </svg>
          <span class="text-[11px] font-semibold">Home</span>
        </button>

        <!-- Lessons (Active) -->
        <button
          class="flex flex-col items-center gap-1.5 w-16 text-primary active:scale-95 transition-transform"
        >
          <svg
            class="w-[26px] h-[26px]"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path d="M4.5 3.75a3 3 0 00-3 3v.75h21v-.75a3 3 0 00-3-3h-15z" />
            <path
              fill-rule="evenodd"
              d="M22.5 9.75h-21v7.5a3 3 0 003 3h15a3 3 0 003-3v-7.5zm-18 3.75a.75.75 0 01.75-.75h6a.75.75 0 010 1.5h-6a.75.75 0 01-.75-.75zm.75 2.25a.75.75 0 000 1.5h3a.75.75 0 000-1.5h-3z"
              clip-rule="evenodd"
            />
          </svg>
          <span class="text-[11px] font-bold">Lessons</span>
        </button>

        <!-- Rank -->
        <button
          class="flex flex-col items-center gap-1.5 w-16 text-gray-400 hover:text-gray-600 active:scale-95 transition-all"
        >
          <svg
            class="w-[26px] h-[26px]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.2"
              d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"
            />
          </svg>
          <span class="text-[11px] font-semibold">Rank</span>
        </button>

        <!-- Profile -->
        <button
          class="flex flex-col items-center gap-1.5 w-16 text-gray-400 hover:text-gray-600 active:scale-95 transition-all"
        >
          <svg
            class="w-[26px] h-[26px]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
          <span class="text-[11px] font-semibold">Profile</span>
        </button>
      </nav>
    </div>
  </body>
</html>
