<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Arabic Master - Home</title>
    <link rel="stylesheet" href="../assets/app.css" />
    <script defer src="../assets/app.js"></script>
  </head>
  <body class="antialiased text-gray-900">
    <div class="app-container">
      <header
        class="flex items-center justify-between px-6 pt-12 pb-4 bg-white/80 backdrop-blur-md z-10 sticky top-0 border-b border-gray-100"
      >
        <div class="flex items-center gap-3">
          <div
            class="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center border-2 border-pink-500 overflow-hidden"
          >
            <svg
              class="w-6 h-6 text-pink-500"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
          </div>
          <div>
            <p class="text-xs text-gray-500 font-medium">Marhaba,</p>
            <h1 class="text-lg font-bold leading-none text-gray-900">Sarah</h1>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button
            aria-label="Current Streak"
            class="flex items-center gap-1.5 bg-orange-50 px-3 py-1.5 rounded-full active:scale-95 transition-transform"
          >
            <svg
              class="w-4 h-4 text-orange-500"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M11.71 3.29a1 1 0 0 0-1.42 0l-7 7a1 1 0 0 0 0 1.42l7 7a1 1 0 0 0 1.42 0l7-7a1 1 0 0 0 0-1.42l-7-7zm-.71 14.2l-5.3-5.3 5.3-5.3 5.3 5.3-5.3 5.3z"
              />
            </svg>
            <span class="text-sm font-bold text-orange-600">12</span>
          </button>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto hide-scrollbar px-6 pb-24 pt-4">
        <section class="mb-8">
          <div
            class="bg-pink-500 rounded-3xl p-6 text-white shadow-lg shadow-pink-500/20 relative overflow-hidden"
          >
            <div
              class="absolute -right-8 -top-8 w-32 h-32 bg-white opacity-10 rounded-full blur-2xl"
            ></div>

            <div class="relative z-10">
              <span
                class="inline-block px-3 py-1 bg-white/20 rounded-lg text-xs font-semibold mb-3 tracking-wide"
                >DAILY GOAL</span
              >
              <h2 class="text-2xl font-bold mb-1">Essential Verbs</h2>
              <p class="text-pink-100 text-sm mb-6">Unit 2 • Lesson 4</p>

              <div class="w-full bg-black/20 rounded-full h-2 mb-6">
                <div class="bg-white h-2 rounded-full" style="width: 65%"></div>
              </div>

              <button
                class="w-full bg-white text-pink-500 font-bold py-4 rounded-xl shadow-sm active:scale-95 transition-transform active:bg-gray-50 flex justify-center items-center gap-2"
              >
                <span>Continue Lesson</span>
                <svg
                  class="w-5 h-5 rtl:rotate-180"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2.5"
                    d="M9 5l7 7-7 7"
                  ></path>
                </svg>
              </button>
            </div>
          </div>
        </section>

        <section class="mb-8">
          <h3 class="text-lg font-bold text-gray-900 mb-4 px-1">
            Learning Modules
          </h3>
          <div class="grid grid-cols-2 gap-4">
            <button
              class="flex flex-col text-start bg-white p-5 rounded-2xl border border-gray-100 shadow-sm active:bg-pink-50 transition-colors"
            >
              <div
                class="w-10 h-10 rounded-xl bg-purple-100 text-purple-500 flex items-center justify-center mb-3"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"
                  ></path>
                </svg>
              </div>
              <h4 class="font-bold text-gray-900">Words</h4>
              <p class="text-xs text-gray-500 mt-1">Vocabulary cards</p>
            </button>

            <button
              class="flex flex-col text-start bg-white p-5 rounded-2xl border border-gray-100 shadow-sm active:bg-pink-50 transition-colors relative overflow-hidden"
            >
              <div
                class="absolute top-4 end-4 w-2.5 h-2.5 bg-pink-500 rounded-full"
              ></div>
              <div
                class="w-10 h-10 rounded-xl bg-blue-100 text-blue-500 flex items-center justify-center mb-3"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 10V3L4 14h7v7l9-11h-7z"
                  ></path>
                </svg>
              </div>
              <h4 class="font-bold text-gray-900">Verbs</h4>
              <p class="text-xs text-gray-500 mt-1">Forms & Tenses</p>
            </button>

            <button
              class="flex flex-col text-start bg-white p-5 rounded-2xl border border-gray-100 shadow-sm active:bg-pink-50 transition-colors col-span-2"
            >
              <div class="flex items-center gap-4">
                <div
                  class="w-12 h-12 rounded-xl bg-green-100 text-green-500 flex items-center justify-center shrink-0"
                >
                  <svg
                    class="w-6 h-6"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
                    ></path>
                  </svg>
                </div>
                <div>
                  <h4 class="font-bold text-gray-900 text-base">
                    Conversations
                  </h4>
                  <p class="text-sm text-gray-500 mt-0.5">
                    Practice with AI Audio
                  </p>
                </div>
              </div>
            </button>
          </div>
        </section>

        <section>
          <div class="flex items-center justify-between mb-4 px-1">
            <h3 class="text-lg font-bold text-gray-900">Needs Review</h3>
            <button
              class="text-sm font-bold text-pink-500 active:text-pink-600"
            >
              See All
            </button>
          </div>

          <div
            class="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex items-center justify-between"
          >
            <div class="flex items-center gap-4">
              <div
                class="w-12 h-12 rounded-full bg-orange-50 flex items-center justify-center shrink-0"
              >
                <svg
                  class="w-5 h-5 text-orange-500"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
                  ></path>
                </svg>
              </div>
              <div>
                <h4 class="font-bold text-gray-900">12 Words Waiting</h4>
                <p class="text-xs text-gray-500 mt-1">
                  Spaced repetition queue
                </p>
              </div>
            </div>
            <button
              aria-label="Start Review"
              class="w-10 h-10 bg-pink-100 text-pink-500 rounded-full flex items-center justify-center active:scale-95 transition-transform"
            >
              <svg
                class="w-5 h-5 rtl:rotate-180"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M9 5l7 7-7 7"
                ></path>
              </svg>
            </button>
          </div>
        </section>
      </main>

      <nav
        class="absolute bottom-0 w-full bg-white border-t border-gray-100 pb-safe pt-2 px-6 flex justify-between items-center z-20"
        style="padding-bottom: max(1rem, env(safe-area-inset-bottom))"
      >
        <button
          class="flex flex-col items-center gap-1 p-2 w-16 group active:scale-95 transition-transform"
        >
          <svg
            class="w-6 h-6 text-pink-500"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
          </svg>
          <span class="text-[10px] font-bold text-pink-500">Home</span>
        </button>

        <button
          class="flex flex-col items-center gap-1 p-2 w-16 group active:scale-95 transition-transform"
        >
          <svg
            class="w-6 h-6 text-gray-400 group-hover:text-gray-900 transition-colors"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
            ></path>
          </svg>
          <span
            class="text-[10px] font-medium text-gray-400 group-hover:text-gray-900 transition-colors"
            >Review</span
          >
        </button>

        <button
          class="flex flex-col items-center gap-1 p-2 w-16 group active:scale-95 transition-transform"
        >
          <svg
            class="w-6 h-6 text-gray-400 group-hover:text-gray-900 transition-colors"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"
            ></path>
          </svg>
          <span
            class="text-[10px] font-medium text-gray-400 group-hover:text-gray-900 transition-colors"
            >Rank</span
          >
        </button>

        <button
          class="flex flex-col items-center gap-1 p-2 w-16 group active:scale-95 transition-transform"
        >
          <svg
            class="w-6 h-6 text-gray-400 group-hover:text-gray-900 transition-colors"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            ></path>
          </svg>
          <span
            class="text-[10px] font-medium text-gray-400 group-hover:text-gray-900 transition-colors"
            >Profile</span
          >
        </button>
      </nav>
    </div>
  </body>
</html>
