<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Arabic Master - Conversations</title>
    <!-- Tailwind CSS v3 -->
    <!-- Multi-language font support: Inter, Noto Sans Arabic, Hind Siliguri -->
    <link rel="stylesheet" href="../assets/app.css" />
    <script defer src="../assets/app.js"></script>
  </head>
  <body class="antialiased text-gray-900">
    <div class="app-container">
      <!-- HEADER (Top Navbar) -->
      <header
        class="flex items-center justify-between px-6 pt-12 pb-4 bg-white/80 backdrop-blur-md z-10 sticky top-0 border-b border-gray-100"
      >
        <!-- Back Button (Simulated for flow) -->
        <button
          aria-label="Go Back"
          class="w-10 h-10 rounded-full flex items-center justify-center active:bg-gray-100 transition-colors -ms-2"
        >
          <svg
            class="w-6 h-6 text-gray-900 rtl:rotate-180"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
        </button>

        <h1 class="text-xl font-bold leading-none text-gray-900">
          Conversations
        </h1>

        <!-- Search/Filter -->
        <button
          aria-label="Search Scenarios"
          class="w-10 h-10 rounded-full flex items-center justify-center active:bg-gray-100 transition-colors -me-2"
        >
          <svg
            class="w-5 h-5 text-gray-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
        </button>
      </header>

      <!-- MAIN SCROLLABLE CONTENT -->
      <main class="flex-1 overflow-y-auto hide-scrollbar px-6 pb-24 pt-6">
        <!-- OVERVIEW BANNER -->
        <section
          class="mb-8 bg-gradient-to-br from-pink-500 to-pink-600 rounded-2xl p-5 text-white shadow-md shadow-pink-500/20"
        >
          <div class="flex items-center justify-between mb-3">
            <div>
              <h2 class="text-lg font-bold">Fluency Path</h2>
              <p class="text-pink-100 text-sm">3 of 11 scenarios completed</p>
            </div>
            <div
              class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center shrink-0 border-2 border-white/30"
            >
              <svg
                class="w-6 h-6 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                ></path>
              </svg>
            </div>
          </div>
          <div class="w-full bg-black/20 rounded-full h-2">
            <div
              class="bg-white h-2 rounded-full transition-all duration-1000"
              style="width: 27%"
            ></div>
          </div>
        </section>

        <!-- SCENARIO LIST -->
        <section class="space-y-4">
          <h3 class="text-base font-bold text-gray-900 px-1 mb-2">
            Real-world Scenarios
          </h3>

          <!-- Active/In-Progress Scenario: Airport -->
          <button
            class="w-full text-start flex items-center p-4 bg-white rounded-2xl border border-gray-200 shadow-sm active:scale-[0.98] active:bg-pink-50 transition-all group relative overflow-hidden"
          >
            <div
              class="w-14 h-14 rounded-2xl bg-blue-100 text-blue-500 flex items-center justify-center shrink-0 me-4"
            >
              <svg
                class="w-7 h-7"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>
            </div>
            <div class="flex-1 min-w-0 py-1">
              <div class="flex items-center justify-between mb-1">
                <h4 class="font-bold text-gray-900 truncate text-base">
                  Airport & Arrival
                </h4>
                <span
                  class="text-xs font-bold text-pink-500 ms-2 bg-pink-50 px-2 py-0.5 rounded-md"
                  >1/5</span
                >
              </div>
              <p class="text-sm text-gray-500 truncate mb-2">مطار (Matar)</p>
              <div class="w-full bg-gray-100 rounded-full h-1.5">
                <div
                  class="bg-pink-500 h-1.5 rounded-full"
                  style="width: 20%"
                ></div>
              </div>
            </div>
          </button>

          <!-- Unlocked Scenario: Taxi -->
          <button
            class="w-full text-start flex items-center p-4 bg-white rounded-2xl border border-gray-200 shadow-sm active:scale-[0.98] active:bg-pink-50 transition-all group"
          >
            <div
              class="w-14 h-14 rounded-2xl bg-yellow-100 text-yellow-600 flex items-center justify-center shrink-0 me-4"
            >
              <svg
                class="w-7 h-7"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"
                ></path>
              </svg>
            </div>
            <div class="flex-1 min-w-0 py-1">
              <div class="flex items-center justify-between mb-1">
                <h4 class="font-bold text-gray-900 truncate text-base">
                  Taking a Taxi
                </h4>
                <svg
                  class="w-5 h-5 text-gray-400 group-active:text-pink-500 rtl:rotate-180"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 5l7 7-7 7"
                  ></path>
                </svg>
              </div>
              <p class="text-sm text-gray-500 truncate mb-2">تاكسي (Taxi)</p>
              <div class="w-full bg-gray-100 rounded-full h-1.5">
                <div
                  class="bg-gray-200 h-1.5 rounded-full"
                  style="width: 0%"
                ></div>
              </div>
            </div>
          </button>

          <!-- Unlocked Scenario: Restaurant -->
          <button
            class="w-full text-start flex items-center p-4 bg-white rounded-2xl border border-gray-200 shadow-sm active:scale-[0.98] active:bg-pink-50 transition-all group"
          >
            <div
              class="w-14 h-14 rounded-2xl bg-orange-100 text-orange-500 flex items-center justify-center shrink-0 me-4"
            >
              <svg
                class="w-7 h-7"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"
                ></path>
              </svg>
            </div>
            <div class="flex-1 min-w-0 py-1">
              <div class="flex items-center justify-between mb-1">
                <h4 class="font-bold text-gray-900 truncate text-base">
                  Restaurant & Food
                </h4>
                <svg
                  class="w-5 h-5 text-gray-400 group-active:text-pink-500 rtl:rotate-180"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 5l7 7-7 7"
                  ></path>
                </svg>
              </div>
              <p class="text-sm text-gray-500 truncate mb-2">مطعم (Mat'am)</p>
              <div class="w-full bg-gray-100 rounded-full h-1.5">
                <div
                  class="bg-gray-200 h-1.5 rounded-full"
                  style="width: 0%"
                ></div>
              </div>
            </div>
          </button>

          <!-- Locked Scenario: Worksite -->
          <div
            class="w-full text-start flex items-center p-4 bg-gray-50 rounded-2xl border border-gray-100 opacity-75"
          >
            <div
              class="w-14 h-14 rounded-2xl bg-gray-200 text-gray-400 flex items-center justify-center shrink-0 me-4"
            >
              <svg
                class="w-7 h-7"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
                ></path>
              </svg>
            </div>
            <div class="flex-1 min-w-0 py-1">
              <div class="flex items-center justify-between mb-1">
                <h4 class="font-bold text-gray-500 truncate text-base">
                  Worksite Setup
                </h4>
                <!-- Lock Icon -->
                <svg
                  class="w-5 h-5 text-gray-300"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                  ></path>
                </svg>
              </div>
              <p class="text-sm text-gray-400 truncate">
                موقع العمل (Mawqi' al-'amal)
              </p>
            </div>
          </div>

          <!-- Locked Scenario: Hajj/Umrah -->
          <div
            class="w-full text-start flex items-center p-4 bg-gray-50 rounded-2xl border border-gray-100 opacity-75"
          >
            <div
              class="w-14 h-14 rounded-2xl bg-gray-200 text-gray-400 flex items-center justify-center shrink-0 me-4"
            >
              <svg
                class="w-7 h-7"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"
                ></path>
              </svg>
            </div>
            <div class="flex-1 min-w-0 py-1">
              <div class="flex items-center justify-between mb-1">
                <h4 class="font-bold text-gray-500 truncate text-base">
                  Hajj & Umrah
                </h4>
                <svg
                  class="w-5 h-5 text-gray-300"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                  ></path>
                </svg>
              </div>
              <p class="text-sm text-gray-400 truncate">
                حج / عمرة (Hajj / Umrah)
              </p>
            </div>
          </div>
        </section>
      </main>

      <!-- BOTTOM NAVIGATION -->
      <nav
        class="absolute bottom-0 w-full bg-white border-t border-gray-100 pb-safe pt-2 px-6 flex justify-between items-center z-20"
        style="padding-bottom: max(1rem, env(safe-area-inset-bottom))"
      >
        <!-- Nav Item: Home -->
        <button
          class="flex flex-col items-center gap-1 p-2 w-16 group active:scale-95 transition-transform"
        >
          <svg
            class="w-6 h-6 text-gray-400 group-hover:text-gray-900 transition-colors"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            ></path>
          </svg>
          <span
            class="text-[10px] font-medium text-gray-400 group-hover:text-gray-900 transition-colors"
            >Home</span
          >
        </button>

        <!-- Nav Item: Conversations (Active state mimicking Review position from Home design) -->
        <button
          class="flex flex-col items-center gap-1 p-2 w-16 group active:scale-95 transition-transform"
        >
          <svg
            class="w-6 h-6 text-pink-500"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"
            />
          </svg>
          <span class="text-[10px] font-bold text-pink-500">Practice</span>
        </button>

        <!-- Nav Item: Leaderboard -->
        <button
          class="flex flex-col items-center gap-1 p-2 w-16 group active:scale-95 transition-transform"
        >
          <svg
            class="w-6 h-6 text-gray-400 group-hover:text-gray-900 transition-colors"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"
            ></path>
          </svg>
          <span
            class="text-[10px] font-medium text-gray-400 group-hover:text-gray-900 transition-colors"
            >Rank</span
          >
        </button>

        <!-- Nav Item: Profile -->
        <button
          class="flex flex-col items-center gap-1 p-2 w-16 group active:scale-95 transition-transform"
        >
          <svg
            class="w-6 h-6 text-gray-400 group-hover:text-gray-900 transition-colors"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            ></path>
          </svg>
          <span
            class="text-[10px] font-medium text-gray-400 group-hover:text-gray-900 transition-colors"
            >Profile</span
          >
        </button>
      </nav>
    </div>
  </body>
</html>
