<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Bhasa Shikhi - Forgot Password</title>
    <link rel="stylesheet" href="../assets/app.css" />
    <script defer src="../assets/app.js"></script>
  </head>
  <body
    class="bg-gray-100 font-sans antialiased text-text-main flex justify-center items-center min-h-screen sm:py-8 selection:bg-primary-light selection:text-primary"
  >
    <div
      class="w-full max-w-[428px] h-[100dvh] sm:h-[900px] bg-background relative sm:rounded-[3rem] sm:border-[10px] sm:border-gray-900 shadow-2xl overflow-hidden flex flex-col"
    >
      <header class="h-14 glass-nav z-50 flex items-center px-2 shrink-0">
        <button
          class="w-12 h-12 flex items-center justify-center rounded-full text-text-main hover:bg-gray-200/50 active:scale-95 transition-all"
          aria-label="Go back"
        >
          <svg
            class="w-6 h-6 rtl:rotate-180"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>
      </header>

      <main class="flex-1 flex flex-col px-6 pt-6 pb-8 overflow-y-auto">
        <div
          class="w-16 h-16 bg-primary-light rounded-2xl flex items-center justify-center mb-6 shadow-sm border border-pink-100"
        >
          <svg
            class="w-8 h-8 text-primary"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
            />
          </svg>
        </div>

        <h1
          class="text-[28px] font-extrabold text-text-main mb-2 tracking-tight leading-tight"
        >
          Reset Password
        </h1>
        <p class="text-[16px] text-muted leading-relaxed mb-8">
          Enter the email address associated with your account. We'll send you a
          6-digit verification code to reset your password.
        </p>

        <div class="flex flex-col gap-2">
          <label
            for="emailInput"
            class="text-[13px] font-bold text-gray-700 ml-1"
            >Email Address</label
          >

          <div class="relative">
            <div
              class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
            >
              <svg
                class="w-5 h-5 text-gray-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                />
              </svg>
            </div>

            <input
              type="email"
              id="emailInput"
              autocomplete="email"
              placeholder="name@example.com"
              class="w-full h-14 bg-surface border border-gray-200 rounded-2xl pl-12 pr-4 text-[16px] text-text-main font-medium placeholder:text-gray-400 focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/15 input-ring-transition shadow-sm"
            />
          </div>
        </div>
      </main>

      <div class="p-6 bg-background pt-2">
        <button
          id="sendCodeBtn"
          disabled
          class="w-full h-14 bg-primary text-white rounded-2xl font-bold text-[17px] flex items-center justify-center shadow-lg shadow-primary/20 disabled:opacity-50 disabled:shadow-none disabled:bg-gray-200 disabled:text-gray-400 transition-all duration-200 active:scale-[0.98]"
        >
          Send Reset Code
        </button>
      </div>
    </div>
  </body>
</html>
