<!doctype html>
<html lang="en" class="h-full bg-background" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Log In — Arabic Master</title>

    <link rel="stylesheet" href="../assets/app.css" />
    <script defer src="../assets/app.js"></script>
  </head>

  <body
    class="h-full lang-en overflow-hidden bg-background text-text-main antialiased selection:bg-primary-light selection:text-primary"
  >
    <!-- Language Switcher -->
    <div class="fixed top-4 right-4 z-50 flex gap-2">
      <button
        onclick="setLanguage('en')"
        class="ux-motion rounded-lg border border-border bg-surface px-2.5 py-1 text-xs font-semibold text-muted shadow-sm hover:text-brand-primary"
      >
        EN
      </button>

      <button
        onclick="setLanguage('ar')"
        class="ux-motion rounded-lg border border-border bg-surface px-2.5 py-1 text-xs font-semibold text-muted shadow-sm hover:text-brand-primary"
      >
        AR
      </button>

      <button
        onclick="setLanguage('bn')"
        class="ux-motion rounded-lg border border-border bg-surface px-2.5 py-1 text-xs font-semibold text-muted shadow-sm hover:text-brand-primary"
      >
        BN
      </button>
    </div>

    <!-- Main Container -->
    <div
      class="relative mx-auto flex h-full max-w-md flex-col bg-background shadow-2xl md:max-w-xl md:border-x md:border-border"
    >
      <!-- Header -->
      <header class="z-10 shrink-0 bg-background px-6 pb-2 pt-6">
        <div class="flex items-center">
          <button
            type="button"
            aria-label="Go back"
            class="ux-motion -ms-3 flex h-12 w-12 items-center justify-center rounded-full text-muted hover:bg-slate-100 hover:text-text-main focus-visible:outline-[3px] focus-visible:outline-primary"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2.5"
              stroke="currentColor"
              class="h-6 w-6 rtl:-scale-x-100"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 19.5L8.25 12l7.5-7.5"
              />
            </svg>
          </button>
        </div>
      </header>

      <!-- Scrollable Content -->
      <div class="no-scrollbar relative flex-1 overflow-y-auto px-6 pb-36">
        <!-- Heading -->
        <div class="space-y-2 pb-8 pt-2 text-start">
          <h1
            id="title-main"
            class="text-3xl font-bold tracking-tight text-text-main"
          >
            Welcome back
          </h1>

          <p id="title-sub" class="text-base text-muted">
            Log in to continue your learning journey.
          </p>
        </div>

        <!-- Google Login -->
        <button
          type="button"
          class="ux-motion flex h-12 w-full items-center justify-center gap-3 rounded-2xl border border-border bg-surface font-semibold text-text-main shadow-sm hover:bg-slate-50 focus-visible:outline-[3px] focus-visible:outline-offset-2 focus-visible:outline-primary active:scale-[0.98]"
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
          </svg>

          <span id="btn-google"> Continue with Google </span>
        </button>

        <!-- Divider -->
        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center" aria-hidden="true">
            <div class="w-full border-t border-border"></div>
          </div>

          <div class="relative flex justify-center">
            <span
              id="lbl-or"
              class="bg-background px-4 text-sm font-medium text-muted"
            >
              Or log in with email
            </span>
          </div>
        </div>

        <!-- Login Form -->
        <form
          id="login-form"
          class="space-y-5"
          novalidate
          oninput="validateForm()"
        >
          <!-- Email -->
          <div>
            <label
              id="lbl-email"
              for="email"
              class="mb-1.5 block text-sm font-medium text-text-main"
            >
              Email address
            </label>

            <input
              type="email"
              id="email"
              required
              placeholder="you@example.com"
              class="ux-motion block h-12 w-full rounded-xl border border-border bg-surface px-4 text-text-main placeholder:text-slate-400 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary"
            />
          </div>

          <!-- Password -->
          <div>
            <div class="mb-1.5 flex items-center justify-between">
              <label
                id="lbl-password"
                for="password"
                class="block text-sm font-medium text-text-main"
              >
                Password
              </label>

              <a
                href="#"
                id="link-forgot"
                class="text-sm font-semibold text-brand-primary hover:text-brand-hover focus:outline-none focus:underline"
              >
                Forgot password?
              </a>
            </div>

            <div class="relative">
              <input
                type="password"
                id="password"
                required
                placeholder="••••••••"
                class="ux-motion block h-12 w-full rounded-xl border border-border bg-surface px-4 pe-12 text-text-main placeholder:text-slate-400 focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary"
              />

              <!-- Toggle Password -->
              <button
                type="button"
                onclick="togglePassword()"
                aria-label="Toggle password visibility"
                class="absolute inset-y-0 end-0 flex w-12 items-center justify-center text-muted hover:text-text-main focus:outline-none"
              >
                <svg
                  id="eye-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                  stroke="currentColor"
                  class="h-5 w-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                  />

                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                  />
                </svg>
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- Bottom CTA -->
      <footer
        class="absolute bottom-0 left-0 z-20 w-full shrink-0 bg-gradient-to-t from-background via-background to-transparent px-6 pb-8 pt-10"
      >
        <button
          type="button"
          id="final-cta"
          disabled
          onclick="submitForm()"
          class="ux-motion flex h-14 w-full cursor-not-allowed items-center justify-center rounded-2xl bg-slate-200 text-base font-semibold text-slate-400 focus-visible:outline-[3px] focus-visible:outline-offset-4 focus-visible:outline-primary"
        >
          Log in
        </button>

        <p class="mt-4 text-center text-sm text-muted">
          <span id="lbl-account"> Don't have an account? </span>

          <a
            href="/html/auth/register.html"
            id="link-signup"
            class="font-semibold text-brand-primary hover:text-brand-hover focus:outline-none focus:underline"
          >
            Sign up
          </a>
        </p>
      </footer>
    </div>
  </body>
</html>
