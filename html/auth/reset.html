<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Bhasa Shikhi - Reset Password</title>
    <link rel="stylesheet" href="../assets/app.css" />
    <script defer src="../assets/app.js"></script>
  </head>
  <body
    class="bg-gray-100 font-sans antialiased text-text-main flex justify-center items-center min-h-screen selection:bg-primary-light selection:text-primary"
  >
    <div
      class="w-full max-w-[428px] h-[100dvh] sm:h-[900px] bg-background relative sm:rounded-[3rem] sm:border-[10px] sm:border-gray-900 shadow-2xl overflow-hidden flex flex-col"
    >
      <header class="h-14 flex items-center px-2 shrink-0">
        <button
          class="w-12 h-12 flex items-center justify-center rounded-full text-text-main hover:bg-gray-200/50 active:scale-95 transition-all"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>
      </header>

      <main class="flex-1 flex flex-col px-6 pt-6 pb-8 overflow-y-auto">
        <div
          class="w-16 h-16 bg-green-50 rounded-2xl flex items-center justify-center mb-6 border border-green-100 text-success"
        >
          <svg
            class="w-8 h-8"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
            />
          </svg>
        </div>

        <h1
          class="text-[28px] font-extrabold text-text-main mb-2 tracking-tight"
        >
          Create new password
        </h1>
        <p class="text-[16px] text-muted mb-8">
          Your new password must be different from previous passwords.
        </p>

        <form id="resetForm" class="flex flex-col gap-5">
          <div class="relative">
            <label class="block text-[13px] font-bold text-gray-700 mb-1 ml-1"
              >New Password</label
            >
            <input
              type="password"
              id="pass1"
              class="w-full h-14 bg-surface border border-gray-200 rounded-2xl px-4 text-[16px] focus:ring-4 focus:ring-primary/15 focus:border-primary outline-none transition-all"
              placeholder="••••••••"
            />
            <button
              type="button"
              class="absolute right-4 top-[38px] text-muted hover:text-text-main"
            >
              👁️
            </button>
          </div>

          <div class="relative">
            <label class="block text-[13px] font-bold text-gray-700 mb-1 ml-1"
              >Confirm Password</label
            >
            <input
              type="password"
              id="pass2"
              class="w-full h-14 bg-surface border border-gray-200 rounded-2xl px-4 text-[16px] focus:ring-4 focus:ring-primary/15 focus:border-primary outline-none transition-all"
              placeholder="••••••••"
            />
          </div>

          <div class="space-y-2 mt-1">
            <div
              id="req-len"
              class="flex items-center gap-2 text-[13px] text-muted"
            >
              <span class="w-2 h-2 rounded-full bg-gray-200"></span> Min 8
              characters
            </div>
            <div
              id="req-num"
              class="flex items-center gap-2 text-[13px] text-muted"
            >
              <span class="w-2 h-2 rounded-full bg-gray-200"></span> One number
              or symbol
            </div>
          </div>
        </form>
      </main>

      <div class="p-6 bg-background pt-2">
        <button
          id="saveBtn"
          disabled
          class="w-full h-14 bg-gray-200 text-gray-400 rounded-2xl font-bold text-[17px] transition-all active:scale-[0.98]"
        >
          Reset Password
        </button>
      </div>
    </div>
  </body>
</html>
